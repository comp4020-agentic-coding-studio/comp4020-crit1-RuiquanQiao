<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P101 News headlines — Teletext</title>
    <meta
      name="description"
      content="Today's headlines, each with the teletext page its story is told on."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="screen">
      <div class="statusbar">
        <span class="service">Teletext</span>
        <span class="page-no">101</span>
      </div>
      <div class="colourbar" aria-hidden="true"></div>
      <p class="band band-blue">Updated <!--tt:clock--></p>

      <main>
        <h1 class="dh">News</h1>
        <p class="band band-cyan">Headlines</p>

        <ol class="headlines"><!--tt:headlines--></ol>

        <p class="wrap source">Type a page number for the story in full</p>
      </main>

      <nav aria-label="Teletext pages">
        <ul class="dir">
          <li class="dir-row"><span>Index</span><a href="./">100</a></li>
          <li class="dir-row"><span>Brief</span><a href="./102.html">102</a></li>
          <li class="dir-row"><span>About</span><a href="./199.html">199</a></li>
          <li class="dir-row"><span>Latest</span><a href="./301.html">301</a></li>
        </ul>
        <div class="fastext">
          <span class="key key-red" aria-disabled="true">101 News</span>
          <a class="key key-green" href="./102.html">102 Brief</a>
          <a class="key key-yellow" href="./199.html">199 About</a>
          <a class="key key-cyan" href="./">100 Index</a>
        </div>
      </nav>
    </div>
  </body>
</html>
